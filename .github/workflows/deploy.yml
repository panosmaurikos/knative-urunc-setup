name: Setup K3s + Knative + urunc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.21.5
      KO_VERSION: 0.15.1
      KO_OS: Linux
      KO_ARCH: x86_64
      KO_DOCKER_REPO: harbor.nbfc.io/nubificus/knative-install-urunc
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

    steps:
      - name: Debug environment
        run: |
          echo "User: $(whoami)"
          echo "PATH: $PATH"
          which sudo || echo "sudo not found"
          which tar || echo "tar not found"
          which apt-get || echo "apt-get not found"

      - name: Install tar if necessary
        run: |
            if ! command -v tar > /dev/null; then
              apt-get update
              apt-get install -y tar
            fi

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install K3s (Single-node)
        run: |
          curl -sfL https://get.k3s.io | sh -
          sleep 10

      - name: Setup kubeconfig for runner user
        run: |
          sudo cp /etc/rancher/k3s/k3s.yaml /home/runner/.kube/config
          sudo chown runner:runner /home/runner/.kube/config
          export KUBECONFIG=/home/runner/.kube/config

      - name: Wait for K3s to be ready
        run: |
          echo "Waiting for K3s to be ready..."
          until kubectl get nodes | grep -q " Ready "; do
            echo "Waiting for nodes to be ready..."
            sleep 5
          done
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Debug nodes
        run: |
          echo "Checking K3s node status..."
          kubectl get nodes -o wide
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Sleep to ensure cluster is ready
        run: sleep 20

      - name: Install Ansible
        run: |
          apt-get update
          apt-get install -y ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i localhost, -c local ansible/install.yml
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml