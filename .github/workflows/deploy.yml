name: Setup K3s + Knative + urunc

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.21.5
      KO_VERSION: 0.15.1
      KO_OS: Linux
      KO_ARCH: x86_64
      KO_DOCKER_REPO: harbor.nbfc.io/nubificus/knative-install-urunc
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install K3s (Single-node)
        run: |
          curl -sfL https://get.k3s.io | sh -
          sleep 10
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml

      - name: Export kubeconfig
        run: |
          mkdir -p ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chown $USER:$USER ~/.kube/config

      - name: Wait for K3s to be ready
        run: |
          echo "Waiting for K3s to be ready..."
          kubectl wait node --all --for=condition=Ready --timeout=120s
      
      - name: Debug nodes
        run: |
          echo "Checking K3s node status..."
          kubectl get nodes -o wide
        
      - name: Sleep to ensure cluster is ready
        run: sleep 20

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i localhost, -c local ansible/install.yml
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
